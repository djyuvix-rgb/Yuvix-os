name: Deploy Yuvizbot

on:
  push:
    branches: [main, claude/wonderful-fermi-3xl5f9]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Check secrets
        id: secrets
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping deploy. Add these repository secrets (Settings → Secrets and variables → Actions):$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or create KV namespace
        if: steps.secrets.outputs.ready == 'true'
        run: |
          TITLE=yuvizbot-data
          find_id() { npx wrangler kv namespace list | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const json=s.slice(s.indexOf("["));
              const ns=JSON.parse(json).find(n=>n.title===process.argv[1]);
              if(ns) console.log(ns.id);
            })' "$TITLE"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create "$TITLE"
            ID=$(find_id)
          fi
          [ -z "$ID" ] && { echo "::error::Could not find or create KV namespace"; exit 1; }
          echo "Using KV namespace $ID"
          sed -i "s/KV_NAMESPACE_ID/$ID/" wrangler.toml

      - name: Deploy worker
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -z "$URL" ] && { echo "::error::Could not read the worker URL. Is a workers.dev subdomain enabled on your Cloudflare account?"; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      - name: Store bot token in the worker
        if: steps.secrets.outputs.ready == 'true'
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Connect Telegram webhook
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEY=$(printf 'yuvizbot:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          for i in 1 2 3 4 5; do
            RES=$(curl -sS "$WORKER_URL/setup?key=$KEY" || true)
            echo "$RES" | grep -q '"webhook":{"ok":true' && { echo "✅ Yuvizbot is live at $WORKER_URL"; exit 0; }
            echo "Attempt $i: $RES"; sleep 5
          done
          echo "::error::Webhook setup failed"; exit 1
